<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd Largest / 2nd Smallest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <div class="page-header">
            <h1>2nd Largest / 2nd Smallest</h1>
            <p>Find the 2nd largest and 2nd smallest numbers in an array</p>
        </div>

        <div class="form-group">
            <label for="arrayInput">Enter Numbers (comma-separated):</label>
            <input type="text" id="arrayInput" placeholder="e.g., 10, 5, 8, 20, 15, 3">
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="findSecondElements()">Find</button>
            <a href="index.html" class="btn-home">Home</a>
        </div>

        <div id="resultBox" class="result-box">
            <h3>Result</h3>
            <div id="resultContent"></div>
        </div>

        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        function findSecondElements() {
            var arrayInputStr = document.getElementById('arrayInput').value;
            var resultBox = document.getElementById('resultBox');
            var resultContent = document.getElementById('resultContent');
            var errorBox = document.getElementById('errorMessage');

            errorBox.classList.remove('show');

            if (arrayInputStr.trim() === '') {
                errorBox.textContent = 'Please enter some numbers';
                errorBox.classList.add('show');
                resultBox.classList.remove('show');
                return;
            }

            // Parse input
            var arrayStr = arrayInputStr.split(',');
            var numbers = [];

            for (var i = 0; i < arrayStr.length; i++) {
                var num = parseFloat(arrayStr[i].trim());
                if (!isNaN(num)) {
                    numbers.push(num);
                }
            }

            if (numbers.length < 2) {
                errorBox.textContent = 'Please enter at least 2 numbers';
                errorBox.classList.add('show');
                resultBox.classList.remove('show');
                return;
            }

            // Sort array in ascending order
            var sortedAsc = numbers.slice().sort(function(a, b) {
                return a - b;
            });

            // Sort array in descending order
            var sortedDesc = numbers.slice().sort(function(a, b) {
                return b - a;
            });

            var secondSmallest = sortedAsc[1];
            var secondLargest = sortedDesc[1];

            resultContent.innerHTML = '<p><strong>Original Array:</strong></p>' +
                                     '<p style="background: white; padding: 10px; border-radius: 5px;">' + 
                                     numbers.join(', ') + '</p>' +
                                     '<p style="margin-top: 15px;"><strong>Sorted (Ascending):</strong></p>' +
                                     '<p style="background: white; padding: 10px; border-radius: 5px;">' + 
                                     sortedAsc.join(', ') + '</p>' +
                                     '<p style="margin-top: 15px;"><strong>Results:</strong></p>' +
                                     '<p style="background: white; padding: 10px; border-radius: 5px;">' +
                                     '  <strong style="color: #667eea;">2nd Largest:</strong> ' + secondLargest + '<br>' +
                                     '  <strong style="color: #764ba2;">2nd Smallest:</strong> ' + secondSmallest +
                                     '</p>';

            resultBox.classList.add('show');
        }

        // Allow Enter to trigger search
        document.getElementById('arrayInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                findSecondElements();
            }
        });
    </script>
</body>
</html>
