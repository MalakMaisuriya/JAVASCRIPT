<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Case Converter</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <div class="page-header">
            <h1>Toggle Case Converter</h1>
            <p>Toggle between uppercase and lowercase for each character</p>
        </div>

        <div class="form-group">
            <label for="textInput">Enter Text:</label>
            <textarea id="textInput" placeholder="e.g., Hello World"></textarea>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="toggleCase()">Toggle Case</button>
            <a href="index.html" class="btn-home">Home</a>
        </div>

        <div id="resultBox" class="result-box">
            <h3>Result</h3>
            <p><strong>Original:</strong></p>
            <div class="result-text" id="originalText"></div>
            <p style="margin-top: 15px;"><strong>Toggled:</strong></p>
            <div class="result-text" id="toggledText"></div>
        </div>

        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        function toggleCase() {
            var textInput = document.getElementById('textInput').value;
            var resultBox = document.getElementById('resultBox');
            var errorBox = document.getElementById('errorMessage');
            var originalText = document.getElementById('originalText');
            var toggledText = document.getElementById('toggledText');

            errorBox.classList.remove('show');

            if (textInput.trim() === '') {
                errorBox.textContent = 'Please enter some text';
                errorBox.classList.add('show');
                resultBox.classList.remove('show');
                return;
            }

            // Toggle case for each character
            var result = '';
            for (var i = 0; i < textInput.length; i++) {
                var currentChar = textInput[i];
                if (currentChar === currentChar.toUpperCase()) {
                    result += currentChar.toLowerCase();
                } else {
                    result += currentChar.toUpperCase();
                }
            }

            originalText.textContent = textInput;
            toggledText.textContent = result;
            resultBox.classList.add('show');
        }

        // Allow Ctrl+Enter to trigger toggle
        document.getElementById('textInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                toggleCase();
            }
        });
    </script>
</body>
</html>
