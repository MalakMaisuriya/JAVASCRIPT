<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest Word in String</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <div class="page-header">
            <h1>Longest Word in String</h1>
            <p>Find the longest word in a given string</p>
        </div>

        <div class="form-group">
            <label for="textInput">Enter Text:</label>
            <textarea id="textInput" placeholder="e.g., The quick brown fox jumps over the lazy dog"></textarea>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="findLongestWord()">Find Longest Word</button>
            <a href="index.html" class="btn-home">Home</a>
        </div>

        <div id="resultBox" class="result-box">
            <h3>Result</h3>
            <div id="resultContent"></div>
        </div>

        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        function findLongestWord() {
            var textInput = document.getElementById('textInput').value;
            var resultBox = document.getElementById('resultBox');
            var resultContent = document.getElementById('resultContent');
            var errorBox = document.getElementById('errorMessage');

            errorBox.classList.remove('show');

            if (textInput.trim() === '') {
                errorBox.textContent = 'Please enter some text';
                errorBox.classList.add('show');
                resultBox.classList.remove('show');
                return;
            }

            // Split text into words and remove special characters
            var words = textInput.split(/\s+/);
            var cleanWords = [];

            for (var i = 0; i < words.length; i++) {
                var cleanWord = words[i].replace(/[^\w]/g, '');
                if (cleanWord.length > 0) {
                    cleanWords.push(cleanWord);
                }
            }

            if (cleanWords.length === 0) {
                errorBox.textContent = 'No valid words found';
                errorBox.classList.add('show');
                resultBox.classList.remove('show');
                return;
            }

            // Find longest word
            var longestWord = cleanWords[0];
            for (var i = 1; i < cleanWords.length; i++) {
                if (cleanWords[i].length > longestWord.length) {
                    longestWord = cleanWords[i];
                }
            }

            resultContent.innerHTML = '<p><strong>Input Text:</strong></p>' +
                                     '<p>' + textInput + '</p>' +
                                     '<p style="margin-top: 15px;"><strong>Longest Word:</strong></p>' +
                                     '<p style="font-size: 1.3rem; color: #667eea; font-weight: bold;">' + longestWord + '</p>' +
                                     '<p><strong>Length:</strong> ' + longestWord.length + ' characters</p>' +
                                     '<p><strong>Total Words Found:</strong> ' + cleanWords.length + '</p>';

            resultBox.classList.add('show');
        }

        // Allow Ctrl+Enter to trigger search
        document.getElementById('textInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                findLongestWord();
            }
        });
    </script>
</body>
</html>
