<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <div class="page-header">
            <h1>Palindrome Checker</h1>
            <p>Check if a word or phrase is a palindrome</p>
        </div>

        <div class="form-group">
            <label for="inputText">Enter Text:</label>
            <input type="text" id="inputText" placeholder="e.g., racecar, madam">
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="checkPalindrome()">Check Palindrome</button>
            <a href="index.html" class="btn-home">Home</a>
        </div>

        <div id="resultBox" class="result-box">
            <h3>Result</h3>
            <div id="resultContent"></div>
        </div>

        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        function checkPalindrome() {
            var inputText = document.getElementById('inputText').value;
            var resultBox = document.getElementById('resultBox');
            var resultContent = document.getElementById('resultContent');
            var errorBox = document.getElementById('errorMessage');

            errorBox.classList.remove('show');

            if (inputText.trim() === '') {
                errorBox.textContent = 'Please enter some text';
                errorBox.classList.add('show');
                resultBox.classList.remove('show');
                return;
            }

            // Remove spaces and convert to lowercase
            var cleanText = inputText.replace(/\s+/g, '').toLowerCase();
            
            // Remove special characters
            cleanText = cleanText.replace(/[^a-z0-9]/g, '');

            if (cleanText === '') {
                errorBox.textContent = 'Please enter valid characters';
                errorBox.classList.add('show');
                resultBox.classList.remove('show');
                return;
            }

            // Check if palindrome by comparing with reversed
            var reversedText = cleanText.split('').reverse().join('');
            var isPalindrome = cleanText === reversedText;

            resultContent.innerHTML = '<p><strong>Input:</strong> ' + inputText + '</p>' +
                                     '<p><strong>Cleaned:</strong> ' + cleanText + '</p>' +
                                     '<p><strong>Reversed:</strong> ' + reversedText + '</p>' +
                                     '<p><strong>Result:</strong> <span style="font-size: 1.2rem; color: ' + 
                                     (isPalindrome ? '#4CAF50' : '#f44336') + '">' + 
                                     (isPalindrome ? '✓ YES, it is a palindrome!' : '✗ NO, it is not a palindrome') + 
                                     '</span></p>';

            resultBox.classList.add('show');
        }

        // Allow Enter key to trigger check
        document.getElementById('inputText').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPalindrome();
            }
        });
    </script>
</body>
</html>
