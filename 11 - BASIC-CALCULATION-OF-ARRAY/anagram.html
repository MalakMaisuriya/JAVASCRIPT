<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anagram Checker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <div class="page-header">
            <h1>Anagram Checker</h1>
            <p>Check if two words are anagrams of each other</p>
        </div>

        <div class="form-group">
            <label for="firstWord">First Word:</label>
            <input type="text" id="firstWord" placeholder="e.g., listen">
        </div>

        <div class="form-group">
            <label for="secondWord">Second Word:</label>
            <input type="text" id="secondWord" placeholder="e.g., silent">
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="checkAnagram()">Check Anagram</button>
            <a href="index.html" class="btn-home">Home</a>
        </div>

        <div id="resultBox" class="result-box">
            <h3>Result</h3>
            <div id="resultContent"></div>
        </div>

        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        function checkAnagram() {
            var firstWord = document.getElementById('firstWord').value;
            var secondWord = document.getElementById('secondWord').value;
            var resultBox = document.getElementById('resultBox');
            var resultContent = document.getElementById('resultContent');
            var errorBox = document.getElementById('errorMessage');

            errorBox.classList.remove('show');

            if (firstWord.trim() === '' || secondWord.trim() === '') {
                errorBox.textContent = 'Please enter both words';
                errorBox.classList.add('show');
                resultBox.classList.remove('show');
                return;
            }

            // Clean and sort characters
            var cleanFirst = firstWord.replace(/\s+/g, '').toLowerCase().split('').sort().join('');
            var cleanSecond = secondWord.replace(/\s+/g, '').toLowerCase().split('').sort().join('');

            // Check if anagram
            var isAnagram = cleanFirst === cleanSecond;

            var result = isAnagram ? '✓ YES, they are anagrams!' : '✗ NO, they are not anagrams';
            var color = isAnagram ? '#4CAF50' : '#f44336';

            resultContent.innerHTML = '<p><strong>First Word:</strong> ' + firstWord + '</p>' +
                                     '<p><strong>Second Word:</strong> ' + secondWord + '</p>' +
                                     '<p><strong>First Sorted:</strong> ' + cleanFirst + '</p>' +
                                     '<p><strong>Second Sorted:</strong> ' + cleanSecond + '</p>' +
                                     '<p><strong>Result:</strong> <span style="font-size: 1.2rem; color: ' + color + '">' + result + '</span></p>';

            resultBox.classList.add('show');
        }

        // Allow Enter key to trigger check
        document.getElementById('secondWord').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnagram();
            }
        });
    </script>
</body>
</html>
