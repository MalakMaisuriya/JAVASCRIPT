<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowels & Consonants Counter</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <div class="page-header">
            <h1>Vowels & Consonants Counter</h1>
            <p>Count vowels and consonants in your text</p>
        </div>

        <div class="form-group">
            <label for="textInput">Enter Text:</label>
            <textarea id="textInput" placeholder="e.g., Hello World"></textarea>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="countVowelsConsonants()">Count</button>
            <a href="index.html" class="btn-home">Home</a>
        </div>

        <div id="resultBox" class="result-box">
            <h3>Result</h3>
            <div id="resultContent"></div>
        </div>

        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        function countVowelsConsonants() {
            var textInput = document.getElementById('textInput').value;
            var resultBox = document.getElementById('resultBox');
            var resultContent = document.getElementById('resultContent');
            var errorBox = document.getElementById('errorMessage');

            errorBox.classList.remove('show');

            if (textInput.trim() === '') {
                errorBox.textContent = 'Please enter some text';
                errorBox.classList.add('show');
                resultBox.classList.remove('show');
                return;
            }

            var vowelCount = 0;
            var consonantCount = 0;
            var vowels = 'aeiouAEIOU';
            var text = textInput.toLowerCase();

            for (var i = 0; i < text.length; i++) {
                var char = text[i];
                
                // Check if it's a letter
                if (char >= 'a' && char <= 'z') {
                    if (vowels.includes(char)) {
                        vowelCount++;
                    } else {
                        consonantCount++;
                    }
                }
            }

            var totalLetters = vowelCount + consonantCount;

            resultContent.innerHTML = '<p><strong>Input Text:</strong></p>' +
                                     '<p>' + textInput + '</p>' +
                                     '<p style="margin-top: 15px;"><strong>Statistics:</strong></p>' +
                                     '<p style="background: white; padding: 10px; border-radius: 5px; margin: 10px 0;">' +
                                     '  <strong style="color: #667eea;">Vowels:</strong> ' + vowelCount + '<br>' +
                                     '  <strong style="color: #764ba2;">Consonants:</strong> ' + consonantCount + '<br>' +
                                     '  <strong style="color: #666;">Total Letters:</strong> ' + totalLetters +
                                     '</p>';

            resultBox.classList.add('show');
        }

        // Allow Ctrl+Enter to trigger count
        document.getElementById('textInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                countVowelsConsonants();
            }
        });
    </script>
</body>
</html>
