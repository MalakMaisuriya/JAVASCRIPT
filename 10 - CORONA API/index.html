<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>COVID-19</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="img/Mk-logo-modified.png" type="image/png">
  </head>
  <body>
    <header>
      <h1>COVID-19 Live Tracker</h1>
      <p>
        Country-wise data.<br />
        State-wise details available for India only
      </p>
    </header>

    <div class="container">
      <input type="text" id="search" placeholder="Search country..." />
      <table>
        <thead>
          <tr>
            <th>Country</th>
            <th>Cases</th>
            <th>Deaths</th>
            <th>Recovered</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <script src="script.js"></script>
  </body>
</html>
